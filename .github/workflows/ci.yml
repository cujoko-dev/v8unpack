name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4

      - name: Locate vcpkg
        shell: pwsh
        run: |
          $root = if ($env:VCPKG_ROOT) { $env:VCPKG_ROOT } else { $env:VCPKG_INSTALLATION_ROOT }
          if (-not $root) { throw 'Neither VCPKG_ROOT nor VCPKG_INSTALLATION_ROOT is set' }
          $toolchain = Join-Path $root 'scripts/buildsystems/vcpkg.cmake'
          if (-not (Test-Path -LiteralPath $toolchain)) { throw "vcpkg toolchain was not found: $toolchain" }
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Configure
        run: cmake --preset windows-x64

      - name: Build
        run: cmake --build --preset windows-x64 --parallel

      - name: Test
        run: ctest --preset windows-x64

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: v8unpack-win-x64
          path: build/windows-x64/Release/v8unpack.exe
          if-no-files-found: error

  linux-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: Configure with sanitizers
        run: >-
          cmake -S . -B build/sanitizers -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined

      - name: Build
        run: cmake --build build/sanitizers --parallel

      - name: Test
        run: ctest --test-dir build/sanitizers --output-on-failure
