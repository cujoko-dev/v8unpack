name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-2022
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches project version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^\d+\.\d+\.\d+$') { throw "Tag $env:GITHUB_REF_NAME is not a three-component semantic version" }
          $project = Select-String -Path CMakeLists.txt -Pattern 'project\(v8unpack VERSION ([0-9.]+)' | Select-Object -First 1
          if (-not $project) { throw 'Project version was not found' }
          $version = $project.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne $version) { throw "Tag $env:GITHUB_REF_NAME does not match version $version" }

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Configure
        run: cmake --preset windows-x64

      - name: Build
        run: cmake --build --preset windows-x64 --parallel

      - name: Test
        run: ctest --preset windows-x64

      - name: Package
        shell: pwsh
        run: ./scripts/package-release.ps1 -Executable build/windows-x64/Release/v8unpack.exe -Version $env:GITHUB_REF_NAME

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME "dist/v8unpack-$env:GITHUB_REF_NAME-win-x64-built-by-cujoko.zip" --generate-notes --verify-tag
